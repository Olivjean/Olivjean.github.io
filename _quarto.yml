project:
  type: website
  output-dir: docs
  render:
    - index.qmd
  resources:
    - CNAME
    - cv.pdf
    - papers/**
    - appendix-branches-and-roots/**

website:
  title: "Jean de Oliveira"
  favicon: assets/favicon.svg
  navbar: false
  page-footer:
    center: ""

format:
  html:
    theme:
      - cosmo
      - styles.scss
    css: assets/fonts/fonts.css
    include-in-header:
      text: |
        <link rel="preload" href="assets/fonts/source-serif-4-roman-latin.woff2" as="font" type="font/woff2" crossorigin>
    resources:
      - assets/fonts/OFL.txt
    toc: false
    page-layout: article
